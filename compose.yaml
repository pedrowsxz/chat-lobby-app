# Local run: `docker compose up --build`, then open http://localhost:8080
# Works from a fresh clone without a .env file: every variable has a dev default.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Lobby_dev_Pa55!}
    ports:
      - "127.0.0.1:1433:1433" # only for running the app from the IDE; not reachable from the network
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=Lobby;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Lobby_dev_Pa55!};TrustServerCertificate=True"
      App__AllowRegistration: ${ALLOW_REGISTRATION:-true}
      Demo__SimulateReplies: ${DEMO_SIMULATE_REPLIES:-true}
    ports:
      - "8080:8080"
    volumes:
      - appdata:/data
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqldata:
  appdata:
