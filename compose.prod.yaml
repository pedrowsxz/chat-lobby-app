# Production, standalone (option A in docs/DEPLOY.md): SQL Server Express + app + Caddy (automatic HTTPS).
#   cp .env.example .env   # then edit it
#   docker compose -f compose.prod.yaml up -d --build
# Only Caddy publishes ports (80/443). The app and the database are reachable only inside this network.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express                 # free edition, 10 GB per database
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: "1024"      # SQL Server would otherwise take most of a small VPS
    mem_limit: 1536m
    volumes:
      - sqldata:/var/opt/mssql
      - ./backups:/var/opt/mssql/backup  # nightly .bak files land here (see DEPLOY.md)
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    build: .
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=Lobby;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      App__BehindProxy: "true"           # trust X-Forwarded-For/Proto from Caddy
      App__AllowRegistration: ${ALLOW_REGISTRATION:-true}
      Demo__SimulateReplies: ${DEMO_SIMULATE_REPLIES:-true}
    volumes:
      - appdata:/data                    # avatars + Data Protection keys
    depends_on:
      sqlserver:
        condition: service_healthy

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    environment:
      LOBBY_DOMAIN: ${LOBBY_DOMAIN:?Set LOBBY_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                 # TLS certificates
      - caddy_config:/config
    depends_on:
      - web

volumes:
  sqldata:
  appdata:
  caddy_data:
  caddy_config:
